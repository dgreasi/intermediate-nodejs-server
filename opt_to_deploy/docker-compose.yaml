version: '2.1'

volumes:
  tailscale-state:
  home-assistant-config:
  matter-server-data:
services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    network_mode: 'host'
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - tailscale-state:/var/lib/tailscale
    environment:
      - TS_AUTHKEY # Set in Balena variables
      - TS_ROUTES # Set in Balena variables
      - TS_ACCEPT_ROUTES # Set in Balena variables
      - TS_HOSTNAME # Set in Balena variables
    restart: unless-stopped

  intermediate-server:
    build: ./node-server
    ports:
      - '80:80'
    environment:
      - PORT=80
      - APP_URL=http://localhost:3000
      - NODE_ENV=staging
      - RUN_TESTS=false
      - LOG_LEVEL=debug

  iperf3:
    image: taoyou/iperf3-alpine
    container_name: iperf3-server
    command: ['-s', '-p', '5201', '--bind', '0.0.0.0']
    network_mode: 'host'
    depends_on:
      - tailscale
    restart: unless-stopped

  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    volumes:
      - home-assistant-config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
      # Add your USB devices here - you'll need to identify them first
      # Example for Zigbee stick (replace with your actual device path):
      # - /dev/ttyUSB0:/dev/ttyUSB0
      # Example for Thread/Matter stick:
      # - /dev/ttyUSB1:/dev/ttyUSB1
    restart: unless-stopped
    privileged: true
    network_mode: host
    environment:
      - TZ=Europe/Athens # Adjust to your timezone
    labels:
      io.balena.features.dbus: '1'
    depends_on:
      - tailscale

  # Optional: Matter Server for Thread/Matter support
  matter-server:
    container_name: matter-server
    image: ghcr.io/home-assistant-libs/python-matter-server:stable
    restart: unless-stopped
    network_mode: host
    security_opt:
      - apparmor=unconfined
    volumes:
      - matter-server-data:/data
      - /run/dbus:/run/dbus:ro
    depends_on:
      - homeassistant
